name: Native Libretro packages

on:
  # main too: the web, 32-bit ARM, iOS and tvOS builds are checked here only,
  # and a release must not be their first run (bug hunt 2026-11-25). The
  # paths filter is not applied to tag pushes.
  push:
    branches: [main, feat/libretro-core]
    tags: ['libretro-v*']
    paths:
      - '.github/workflows/libretro.yml'
      - '.github/actions/fetch-test-media/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'imgui_pin.env'
      - 'include/**'
      - 'libretro/**'
      - 'packaging/disks/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'vcpkg.json'
  pull_request:
    paths:
      - '.github/workflows/libretro.yml'
      - '.github/actions/fetch-test-media/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'imgui_pin.env'
      - 'include/**'
      - 'libretro/**'
      - 'packaging/disks/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'vcpkg.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Libretro ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            module: build/pom2_libretro.so
          # Raspberry Pi and other ARM boards: a native runner, so the same
          # CTest commands and RetroArch check run on the ARM build.
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            module: build/pom2_libretro.so
          - platform: macos-arm64
            runner: macos-15
            module: build/pom2_libretro.dylib
          - platform: windows-x64
            runner: windows-2022
            module: build/Release/pom2_libretro.dll
    defaults:
      run:
        shell: bash
    env:
      MODULE_PATH: ${{ matrix.module }}
      PACKAGE_FILE: pom2-libretro-${{ matrix.platform }}.zip
      RETROARCH_VERSION: '1.22.2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/fetch-test-media

      - name: Fetch pinned Dear ImGui
        run: tools/fetch_imgui_pinned.sh

      - name: Install Linux build and RetroArch dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev libgl1-mesa-dri \
            retroarch retroarch-assets xvfb xauth

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Prefetch pinned Windows vcpkg sources
        if: runner.os == 'Windows'
        run: tools/prefetch_vcpkg_sources.sh

      - name: Configure native Unix build
        if: runner.os != 'Windows'
        run: |
          native=()
          if [ "$RUNNER_OS" = macOS ]; then
            native+=(-DCMAKE_OSX_ARCHITECTURES=arm64)
          fi
          cmake -S . -B build "${native[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_SLIRP=OFF \
            -DPOM2_ENABLE_TESTS=ON \
            -DPOM2_PORTABLE_TESTS_ONLY=ON \
            -DPOM2_BUILD_LIBRETRO=ON

      - name: Configure MSVC x64 build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DPOM2_ENABLE_SLIRP=OFF `
            -DPOM2_ENABLE_TESTS=ON `
            -DPOM2_PORTABLE_TESTS_ONLY=ON `
            -DPOM2_BUILD_LIBRETRO=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the module and ABI test frontend
        run: cmake --build build --config Release --parallel 4 --target test_pom2_libretro

      - name: Package and stage the shipped module for CTest
        run: |
          mkdir -p dist/libretro dist/libretro-results
          package="dist/libretro/$PACKAGE_FILE"
          if [ "$RUNNER_OS" = macOS ]; then
            lipo "$MODULE_PATH" -verify_arch arm64
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # RetroArch for Windows ships no VC++ runtime: a core importing it
            # fails to open on a PC without the redistributable, which the
            # runner has. The import table names its DLLs in plain ASCII.
            python - "$MODULE_PATH" <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read().lower()
          bad = [n for n in (b"msvcp140", b"vcruntime140", b"api-ms-win-crt-") if n in data]
          if bad:
              raise SystemExit(f"the core imports the VC++ runtime: {b', '.join(bad).decode()}")
          print("no VC++ runtime import")
          PY
          fi
          python tools/package_libretro.py "$MODULE_PATH" "$package" | tee dist/libretro-results/package.log
          (cd dist/libretro && cmake -E sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256")

          # The seven CTest commands resolve the configured target file. Replacing
          # it with the extracted ZIP member makes every command test the package.
          python -m zipfile -e "$package" build/libretro-install
          cmake -E rename "$MODULE_PATH" "$MODULE_PATH.unpacked-build"
          cmake -E copy "build/libretro-install/cores/$(basename "$MODULE_PATH")" "$MODULE_PATH"

      - name: Require all eight packaged-core regressions
        run: |
          ctest --test-dir build -C Release -R '^pom2_libretro_' --no-tests=error \
            --output-on-failure --output-junit "$PWD/dist/libretro-results/ctest.xml" \
            | tee dist/libretro-results/ctest.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected = {"abi", "media", "disk_persistence", "keyboard", "dix", "desktop", "formats", "netplay"}
          expected = {"pom2_libretro_" + name for name in expected}
          cases = ET.parse("dist/libretro-results/ctest.xml").findall(".//testcase")
          names = {case.get("name") for case in cases}
          if names != expected or len(cases) != len(expected):
              raise SystemExit(f"Unexpected CTest inventory: missing {expected - names}; extra {names - expected}")
          for case in cases:
              if any(case.find(tag) is not None for tag in ("skipped", "failure", "error")):
                  raise SystemExit(f"Required package regression did not pass: {case.get('name')}")
          print(f"All {len(cases)} packaged-core regressions passed without skips")
          PY

      - name: Install the RetroArch smoke test dependency
        run: python -m pip install 'Pillow==13.0.0'

      - name: Boot and resume the package in Linux RetroArch
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          retroarch --version | tee dist/libretro-results/retroarch-version.txt
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            python tools/check_libretro_package.py "dist/libretro/$PACKAGE_FILE" \
            "$(command -v retroarch)" roms packaging/disks/DIRTBIKE.dsk \
            --output dist/libretro-results | tee dist/libretro-results/retroarch-smoke.log

      - name: Boot and resume the package in macOS RetroArch
        if: runner.os == 'macOS'
        run: |
          archive="$RUNNER_TEMP/RetroArch_Metal.dmg"
          mountpoint="$RUNNER_TEMP/retroarch-mounted"
          mkdir -p "$mountpoint"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://buildbot.libretro.com/stable/$RETROARCH_VERSION/apple/osx/universal/RetroArch_Metal.dmg" \
            --output "$archive"
          echo "81b79121ba26d539064ae13b4d0419a120c3d165afbe656cf5f5412b15fdb434  $archive" | shasum -a 256 -c -
          hdiutil attach "$archive" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          executable="$mountpoint/RetroArch.app/Contents/MacOS/RetroArch"
          "$executable" --version | tee dist/libretro-results/retroarch-version.txt
          python tools/check_libretro_package.py "dist/libretro/$PACKAGE_FILE" \
            "$executable" roms packaging/disks/DIRTBIKE.dsk \
            --output dist/libretro-results | tee dist/libretro-results/retroarch-smoke.log

      - name: Install portable Windows RetroArch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'RetroArch.7z'
          $output = Join-Path $env:RUNNER_TEMP 'retroarch-portable'
          $url = "https://buildbot.libretro.com/stable/$env:RETROARCH_VERSION/windows/x86_64/RetroArch.7z"
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 30 $url --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($digest -ne 'b2139b1d0f9d4526dc6b5ce23cbb3efdc766096fa6f2c3df016818b486ac6372') {
            throw 'Unexpected checksum for the official Windows RetroArch archive'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $sevenZip x $archive "-o$output" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executables = @(Get-ChildItem -Path $output -File -Recurse -Filter 'retroarch.exe')
          if ($executables.Count -ne 1) { throw 'Expected one RetroArch executable in the official Windows archive' }
          "RETROARCH_EXECUTABLE=$($executables[0].FullName)" >> $env:GITHUB_ENV

      - name: Boot and resume the package in Windows RetroArch
        if: runner.os == 'Windows'
        run: |
          printf 'RetroArch %s (portable x86_64)\n' "$RETROARCH_VERSION" > dist/libretro-results/retroarch-version.txt
          python tools/check_libretro_package.py "dist/libretro/$PACKAGE_FILE" \
            "$RETROARCH_EXECUTABLE" roms packaging/disks/DIRTBIKE.dsk \
            --output dist/libretro-results | tee dist/libretro-results/retroarch-smoke.log

      - name: Upload verified release package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pom2-libretro-${{ matrix.platform }}
          path: dist/libretro/
          if-no-files-found: error
          compression-level: 0

      - name: Upload package verification results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pom2-libretro-results-${{ matrix.platform }}
          path: dist/libretro-results/
          if-no-files-found: ignore

  # Android cannot run RetroArch on a runner: cross-compile with the NDK,
  # prove the module exports exactly the libretro API, and package it.
  android:
    name: Libretro android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Cross-compile the core with the Android NDK
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release -DPOM2_LIBRETRO_ONLY=ON \
            -DPOM2_ENABLE_SLIRP=OFF -DPOM2_ENABLE_TESTS=OFF
          cmake --build build --target pom2_libretro --parallel 4

      - name: Strip and check the exported libretro API
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          module=build/pom2_libretro_android.so
          "$bin/llvm-strip" --strip-unneeded "$module"
          # grep reads all of it: a grep -q exiting early breaks the pipe
          # under pipefail (readelf exits 74).
          "$bin/llvm-readelf" -h "$module" | grep 'AArch64' > /dev/null
          exported=$("$bin/llvm-nm" -D --defined-only "$module" | awk '$2 == "T" {print $3}')
          if echo "$exported" | grep -v '^retro_'; then
            echo "::error::the Android module exports more than the libretro API"; exit 1
          fi
          test "$(echo "$exported" | wc -l)" -eq 25

      - name: Package the Android core
        run: |
          mkdir -p dist/libretro
          python tools/package_libretro.py build/pom2_libretro_android.so \
            dist/libretro/pom2-libretro-android-arm64.zip
          (cd dist/libretro && cmake -E sha256sum pom2-libretro-android-arm64.zip > pom2-libretro-android-arm64.zip.sha256)

      - name: Cross-compile and check the 32-bit Android core (armeabi-v7a)
        run: |
          cmake -S . -B build-armv7 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DPOM2_LIBRETRO_ONLY=ON \
            -DPOM2_ENABLE_SLIRP=OFF -DPOM2_ENABLE_TESTS=OFF
          cmake --build build-armv7 --target pom2_libretro --parallel 4
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          module=build-armv7/pom2_libretro_android.so
          "$bin/llvm-readelf" -h "$module" | grep -E 'Class:.*ELF32' > /dev/null
          "$bin/llvm-readelf" -h "$module" | grep 'ARM' > /dev/null
          exported=$("$bin/llvm-nm" -D --defined-only "$module" | awk '$2 == "T" {print $3}')
          if echo "$exported" | grep -v '^retro_'; then
            echo "::error::the armeabi-v7a module exports more than the libretro API"; exit 1
          fi
          test "$(echo "$exported" | wc -l)" -eq 25

      - name: Upload the Android package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pom2-libretro-android-arm64
          path: dist/libretro/
          if-no-files-found: error
          compression-level: 0

  # 32-bit ARM Linux (Raspberry Pi OS armhf, handhelds on armv7): libretro
  # builds it from libretro-super's armhf recipes. Cross-compiled here, then
  # the ABI frontend runs the module under qemu-arm: a 32-bit size_t, a
  # 32-bit time_t and armv7's alignment are exercised, not just compiled.
  linux-armhf:
    name: Libretro linux-armhf (qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/fetch-test-media

      - name: Install the armhf cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user

      - name: Cross-compile the core and the ABI test frontend
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DPOM2_LIBRETRO_ONLY=ON -DPOM2_ENABLE_SLIRP=OFF -DPOM2_ENABLE_TESTS=OFF
          cmake --build build --target pom2_libretro --parallel 4
          arm-linux-gnueabihf-g++ -std=c++17 -O1 -DRETRO_IMPORT_SYMBOLS \
            -isystem src/third_party/libretro tests/libretro_module_test.cpp -ldl -o build/test_pom2_libretro
          arm-linux-gnueabihf-readelf -h build/pom2_libretro.so > build/elf-header.txt
          grep -E 'Class:.*ELF32' build/elf-header.txt
          grep -E 'Machine:.*ARM' build/elf-header.txt
          exported=$(arm-linux-gnueabihf-nm -D --defined-only build/pom2_libretro.so | awk '$2 == "T" {print $3}')
          if echo "$exported" | grep -v '^retro_'; then
            echo "::error::the armhf module exports more than the libretro API"; exit 1
          fi
          test "$(echo "$exported" | wc -l)" -eq 25

      - name: Run the ABI, media and disk persistence checks under qemu-arm
        env:
          QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
          POM2_MEDIA_WRITE_DEFAULT: protected
        run: |
          t=build/test_pom2_libretro; core=build/pom2_libretro.so
          qemu-arm "$t" "$core" build/abi
          qemu-arm "$t" "$core" build/media roms packaging/disks/DIRTBIKE.dsk
          qemu-arm "$t" "$core" build/persist --disk-persistence roms disks_5.4/dsk/dos33_master.dsk

  # RetroArch's web build links one core statically: libretro's emscripten
  # template configures with LIBRETRO_STATIC and takes the archive. Built
  # here the same way, then linked into a small frontend and RUN under Node.
  web:
    name: Libretro web (emscripten, node)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: ./.github/actions/fetch-test-media

      - name: Set up Emscripten SDK
        id: emsdk
        continue-on-error: true
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          # libretro's emscripten image (libretro-build-emscripten, the one
          # the buildbot links RetroArch with) is Emscripten 3.1.46: the
          # version the core must build with, not the desktop WASM's 6.0.9.
          version: 3.1.46
          actions-cache-folder: emsdk-cache-libretro

      - name: Install the same Emscripten SDK through Git if archive download failed
        if: steps.emsdk.outcome == 'failure'
        run: bash tools/setup_emsdk_git_fallback.sh 3.1.46

      - name: Build the static core as libretro's emscripten template does
        run: |
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBRETRO_STATIC=ON \
            -DLIBRETRO_SUFFIX=_emscripten -DPOM2_LIBRETRO_ONLY=ON \
            -DPOM2_ENABLE_SLIRP=OFF -DPOM2_ENABLE_TESTS=OFF
          emmake cmake --build build --target pom2_libretro --parallel 4
          ls -l build/pom2_libretro_emscripten.bc

      - name: Link it into a frontend and run it under Node
        run: |
          # RetroArch renames libretro_emscripten.bc to .a before it links
          # (Makefile.emscripten, mv_libretro); emcc reads .bc as bitcode.
          cp build/pom2_libretro_emscripten.bc build/libretro_emscripten.a
          em++ -std=c++17 -O2 -isystem src/third_party/libretro -c tests/libretro_web_smoke.cpp -o build/web_smoke.o
          em++ -O2 build/web_smoke.o build/libretro_emscripten.a -sNODERAWFS=1 -sALLOW_MEMORY_GROWTH=1 \
            -sINITIAL_MEMORY=134217728 -sSTACK_SIZE=4194304 -sWASM_BIGINT=1 -o build/web_smoke.js
          mkdir -p build/web/system build/web/saves
          ln -s "$PWD/roms" build/web/system/pom2
          cp packaging/disks/DIRTBIKE.dsk build/web/
          node build/web_smoke.js "$PWD/build/web/system" "$PWD/build/web/saves" "$PWD/build/web/DIRTBIKE.dsk"

  # iOS and tvOS are built by libretro's buildbot (.gitlab-ci.yml); compile
  # them here with the same arguments as its templates so a change that
  # breaks them shows on our CI first. Not packaged: an iOS core is installed
  # through RetroArch's own downloader.
  apple-mobile:
    name: Libretro ${{ matrix.platform }} (compile)
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # LC_BUILD_VERSION's platform: 2 iOS, 3 tvOS (mach-o/loader.h).
          - platform: ios-arm64
            system: iOS
            platform_id: 2
          - platform: tvos-arm64
            system: tvOS
            platform_id: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Cross-compile the core as libretro's ${{ matrix.system }} template does
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-DIOS -DCMAKE_CXX_FLAGS=-DIOS -DIOS=ON \
            -DCMAKE_SYSTEM_NAME=${{ matrix.system }} -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPOM2_LIBRETRO_ONLY=ON -DPOM2_ENABLE_SLIRP=OFF -DPOM2_ENABLE_TESTS=OFF
          cmake --build build --target pom2_libretro --config RelWithDebInfo --parallel 4
          otool -l build/pom2_libretro.dylib | grep -A3 LC_BUILD_VERSION | tee build/build-version.txt
          grep -E '^ *platform ${{ matrix.platform_id }}$' build/build-version.txt
          otool -L build/pom2_libretro.dylib
          retro=$(nm -gU build/pom2_libretro.dylib | grep -c ' _retro_')
          echo "$retro libretro symbols exported"
          test "$retro" -eq 25

  publish:
    name: Publish Libretro release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/libretro-v')
    # Every build the release notes say is checked: none may be red.
    needs: [native, android, linux-armhf, web, apple-mobile]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      # Only the release notes are read from the tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: pom2-libretro-*
          path: artifacts

      - name: Verify release inputs and collect checksums
        shell: bash
        run: |
          mkdir release
          results=()
          for platform in linux-x64 linux-arm64 macos-arm64 windows-x64; do
            artifact="pom2-libretro-$platform"
            (cd "artifacts/$artifact" && sha256sum --check "$artifact.zip.sha256")
            cp "artifacts/$artifact/$artifact.zip" release/
            result="artifacts/pom2-libretro-results-$platform"
            test -s "$result/ctest.xml"
            test -s "$result/retroarch-smoke.log"
            results+=("$result")
          done
          # Android is built and checked, not run: no RetroArch on a runner.
          (cd artifacts/pom2-libretro-android-arm64 && sha256sum --check pom2-libretro-android-arm64.zip.sha256)
          cp artifacts/pom2-libretro-android-arm64/pom2-libretro-android-arm64.zip release/
          python3 -m zipfile -c release/pom2-libretro-verification.zip "${results[@]}"
          (cd release && sha256sum ./*.zip > SHA256SUMS)

          # Hand-written notes for this tag first (docs/releases/libretro-vX.Y.Z.md),
          # then the standing text on what the packages are and how they were checked.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            sed '1{/^# POM2 /d;}' "$notes" > release-notes.md
            printf '\n---\n\n' >> release-notes.md
          else
            : > release-notes.md
          fi
          cat >> release-notes.md <<'EOF'
          Native POM2 Libretro core packages tested with RetroArch on Linux x64, Linux arm64, macOS arm64, and Windows x64, plus an Android arm64 core built with the NDK (not run in CI).

          Install the core and its info file in the directories listed by RetroArch under Settings → Directory. Supply your Apple //e firmware in `system/pom2/`. Each ZIP includes the user guide and compatibility report. The verification ZIP contains native test results, RetroArch logs and screenshots of a resumed Dirtbike session for all four platforms.
          EOF
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          printf '\n[Installation and controls](%s/libretro/README.md) · [Compatibility measurements](%s/docs/audits/libretro-compatibility-2026-11-23.md)\n' "$base" "$base" >> release-notes.md

      - name: Publish assets for the existing Libretro tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "POM2 Libretro ${GITHUB_REF_NAME#libretro-}" \
            --notes-file release-notes.md release/*.zip release/SHA256SUMS
