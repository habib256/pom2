# Release packaging — build POM2 on each native OS and attach the packages to a
# GitHub Release. Modelled on POM1's release.yml (same runner matrix, same
# verify-then-smoke-launch discipline), minus POM1's cc65 bundling: POM2 has no
# in-app assembler, so there is no toolchain to stage.
#
# SEVEN packages, and why each is what it is:
#   linux       ubuntu-latest + PINNED bionic container → AppImage x86_64
#   linux-arm64 ubuntu-24.04-arm (native)               → AppImage aarch64
#   raspberry   ubuntu-24.04-arm + debian:bookworm      → AppImage raspberry-aarch64 (GLES)
#   pi400       ubuntu-24.04-arm + bookworm + PGO/LTO   → AppImage pi400-aarch64 (cortex-a72)
#   macos       macos-15 (arm64)                        → Universal 2 .dmg
#   windows     windows-latest + vcpkg static triplet   → self-contained .zip
#   wasm        ubuntu-latest + emsdk                   → web-wasm .zip
#   publish     ubuntu-latest                           → Release + SHA256SUMS
#
# THREE aarch64 AppImages, which is not redundancy — each targets a floor the
# others cannot serve, and the file NAME is what tells a user which to take:
#   ·  -aarch64            glibc 2.39, desktop GL — current ARM desktops/servers
#   ·  -raspberry-aarch64  glibc 2.36, GLES       — Pi OS, generic Pi 3 → Pi 5
#   ·  -pi400-aarch64      as above + -mcpu=cortex-a72 + PGO/LTO; will NOT start
#                          on an older core. That is the price of the ~-39 % it
#                          buys (docs/PERFORMANCE.md).
# The variant tag is enforced by a name check in each job: the publish step
# flattens every artifact into one directory, so two same-named packages would
# overwrite each other in silence.
#
# The Pi jobs build with -DPOM2_GLES=ON: Mesa's V3D caps *desktop* GL at 3.1 on
# Pi 4/5, so POM2's default GL 3.2 core request fails outright there. GLES 3.0 is
# what the hardware exposes, and POM2 compiles for it from the same sources
# (Pom2Build.h's POM2_GL_ES). CI can prove it BUILDS, links GLESv2 and not
# desktop libGL, and starts — it cannot prove it renders correctly on a Pi. Do
# that on real hardware before announcing the package.
#
# Every package job runs the SAME two checks past "does it start":
#   · payload   packaging/stage_data.sh --verify — the manifest's assets are all
#               there, and nothing deny-listed (disks_5.4, hdv, …) leaked in.
#               Both failures are silent otherwise: a missing font drops the UI
#               to blank icon boxes, a leaked library turns a 6 MB download into
#               a 200 MB one carrying media that is not ours to redistribute.
#   · boot      pom2_headless --frames 300 --screenshot — the PACKAGED binary
#               resolves its own bundled roms/, runs 6502 code and draws a
#               frame that is not one flat colour. `--help` proves none of that.
#
# Triggers: push a version tag to cut a release; "Run workflow" for a dry run
# (artifacts only, no Release). Both tag conventions fire, matching POM1: the
# `v`-prefixed form (v0.8) and the bare numeric form (0.8).
name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'        # v0.8
      - '[0-9]*'         # 0.8
  workflow_dispatch:

# Read-only by DEFAULT, write only where it is used. `contents: write` was set
# here at the top and inherited by every job — including five that only compile
# and upload artefacts (version, linux-arm64, macos, windows, wasm), each of
# them running third-party actions and, in the container jobs, a whole apt
# tree. A token that can push to the repository has no business in a compile
# step. The `publish` job below re-grants it, and it is the only one that
# touches the Release.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------- normalize version ----
  # One source of truth for the package version. Strips a leading `v` so the
  # value is the bare number regardless of which tag convention was pushed —
  # each packager prepends its own `v`, so without this a v-prefixed tag would
  # produce POM2-macOS-vv0.8.dmg. Empty on workflow_dispatch (no tag), in which
  # case each packager falls back to the version in CMakeLists.txt.
  version:
    runs-on: ubuntu-latest
    outputs:
      pom2_version: ${{ steps.v.outputs.pom2_version }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          PROJECT_VERSION=$(sed -n 's/^project(pom2_imgui VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$PROJECT_VERSION" || { echo "Cannot read project version"; exit 1; }
          if [ "$REF_TYPE" = "tag" ]; then
              TAG_VERSION=${REF_NAME#v}
              test "$TAG_VERSION" = "$PROJECT_VERSION" || {
                  echo "ERROR: tag $REF_NAME does not match CMake project version $PROJECT_VERSION"
                  exit 1
              }
              echo "pom2_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
              echo "pom2_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------- quality gate ----
  # Release publication must not rely on a separate, concurrently-running CI
  # workflow: that workflow can fail after packages have already been attached.
  # Keep an explicit test gate in this dependency graph. Parallelism is capped
  # because POM2's large C++ translation units can exhaust RAM at `-j$(nproc)`.
  quality:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libglfw3-dev libgl1-mesa-dev libslirp-dev

      - name: Fetch Dear ImGui (pinned commit)
        run: tools/fetch_imgui_pinned.sh

      - name: Configure and build tests
        run: |
          cmake -S . -B build-quality \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOM2_ENABLE_TESTS=ON \
            -DPOM2_FETCH_TOMHARTE=ON
          test "$(find build-quality/tests/tomharte/6502 -name '*.json' | wc -l)" \
            -eq "$(grep -Evc '^[[:space:]]*(#|$)' tests/tomharte_6502.manifest)"
          test "$(find build-quality/tests/tomharte/wdc65c02 -name '*.json' | wc -l)" \
            -eq "$(grep -Evc '^[[:space:]]*(#|$)' tests/tomharte_wdc65c02.manifest)"
          cmake --build build-quality --parallel 1

      - name: Run complete test suite
        working-directory: build-quality
        run: ctest --output-on-failure --parallel 1

  # ---------------------------------------------------------------- Linux ----
  # Built INSIDE the pinned bionic (glibc 2.27) image so the AppImage runs on
  # every distro still in use. This is not theoretical: an AppImage never bundles
  # glibc, so its floor IS the build machine's, and building on ubuntu-latest
  # stamps GLIBC_2.38 — which refuses to start on Debian 12 (2.36), Ubuntu 22.04
  # (2.35) or Mint 21. Measured, not assumed; the verify step below asserts it.
  #
  # `docker run` rather than a `container:` key because GitHub's node24 actions
  # (checkout@v5, upload-artifact@v5) need glibc >= 2.28 — one notch above
  # bionic's 2.27 — so they cannot run inside a bionic `container:`. The actions
  # run on the host; the repo is bind-mounted into the container.
  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read       # pull the builder image from GHCR
    env:
      # REUSES POM1's builder image, pinned by digest. The requirements are
      # identical — glibc 2.27, g++-9 (bionic's default 7 has no usable
      # <filesystem>), CMake >= 3.16, GLFW 3.3 from source, and an AppImageKit
      # appimagetool whose runtime is ET_EXEC — so maintaining a second, nearly
      # byte-identical image would just be two things to keep in sync. POM1
      # additionally bakes cc65 and a python3.8 alternative; both are dead weight
      # here and harmless.
      #
      # Rebuild it from POM1 (packaging/linux/Dockerfile.bionic + its
      # build-bionic-image workflow), then re-pin the digest it prints in BOTH
      # repositories.
      #
      # PREREQUISITE: the GHCR package must be reachable from this repository —
      # either public, or with `pom2` added under the package's
      # "Manage Actions access". Otherwise `docker pull` 403s here even though
      # the token has packages: read, because GHCR scopes access per package,
      # not per owner.
      BUILDER_IMAGE: ghcr.io/habib256/pom1-bionic-builder@sha256:c44b786517f041f779b082b813e84a17b141db3983fc0b28f2c3e4deedeb4cca
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR (pull the builder image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build POM2 + AppImage in the pinned bionic builder
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          IMAGE="$(echo "$BUILDER_IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POM2_VERSION \
            -e POM2_APPIMAGE_TOOLS_DIR=/opt/appimage-tools \
            "$IMAGE" \
            bash /work/packaging/linux/build_in_bionic.sh

      - name: Verify the AppImage — ET_EXEC, magic, glibc floor, no bundled GL
        run: |
          set -euo pipefail
          # The container ran as root, so the artifact is root-owned: read and
          # execute it, never chmod (that would EPERM as the runner user).
          APP=$(ls dist/*.AppImage | head -1)
          echo "Package: $APP"
          # The runtime must be ELF ET_EXEC. The newer static-pie ET_DYN runtime
          # is rejected by AppImageLauncher as "type -1" — this asserts the
          # AppImageKit appimagetool baked into the image is the one in use.
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          echo "AppImage runtime ELF type: ${TYPE}"
          test "$TYPE" = "EXEC" \
            || { echo "ERROR: runtime is $TYPE, not EXEC — AppImageLauncher will reject it"; exit 1; }
          # AI\x02 at offset 8 = valid AppImage type 2.
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" \
            || { echo "ERROR: bad AppImage magic $MAGIC (expected 414902)"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM2
          MAX=$(objdump -T "$BIN" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Highest glibc symbol required by POM2: ${MAX:-none}"
          test "$(printf '%s\nGLIBC_2.27\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.27" \
            || { echo "ERROR: AppImage requires ${MAX} > GLIBC_2.27"; exit 1; }
          # Graphics-driver libraries must come from the HOST. Bundling libGL
          # would override the user's GPU driver — a silent drop to software
          # rendering at best, a driver-ABI mismatch at worst.
          if ls squashfs-root/usr/lib/ 2>/dev/null | grep -qE '^lib(GL|EGL|GLX|OpenGL|GLdispatch)\.'; then
            echo "ERROR: the AppImage bundles a graphics-driver library:"
            ls squashfs-root/usr/lib/ | grep -E '^lib(GL|EGL|GLX|OpenGL|GLdispatch)\.'
            exit 1
          fi
          echo "OK: ET_EXEC + magic + glibc floor <= 2.27 + no bundled GL"

      - name: Install runtime GL/X libs for the launch smoke
        run: |
          set -eu
          # These are DT_NEEDED and resolved at exec, before main runs, so they
          # must exist even though --help opens no window and creates no GL
          # context. No Xvfb or GPU is needed. glibc is forward-compatible, so
          # the 2.27-built binary loads fine against the runner's newer libs.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--help)
        run: |
          set -euo pipefail
          # The checks above prove the file is SHAPED right; this proves it RUNS
          # — AppRun sets up the environment and the bundled libs resolve.
          # --help exits 0 before GLFW/any window, so it is safe display-less.
          #
          # Runs AppRun out of the squashfs-root the verify step already
          # extracted, rather than `"$APP" --appimage-extract-and-run`. Same code
          # path (AppRun → usr/bin/POM2, bundled libs, no FUSE needed), but it
          # cannot be intercepted: on a desktop with AppImageLauncher installed,
          # that flag is swallowed by the launcher, which then dies and produces
          # NO output — so this step would fail on a perfectly good package and
          # send you hunting a packaging bug that does not exist. Reproducible
          # by hand on any machine, which the runtime-flag form is not.
          #
          # NOTE the 2>&1: POM2 prints its banner AND its usage to stderr, so a
          # bare $(...) capture comes back empty and every grep below fails.
          test -x squashfs-root/AppRun || { echo "ERROR: squashfs-root/AppRun missing"; exit 1; }
          OUT=$(./squashfs-root/AppRun --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print its usage"; exit 1; }
          # Also asserts the version actually got stamped into the binary.
          grep -qE "POM2: v[0-9]" <<<"$OUT" \
            || { echo "ERROR: no version banner — Version.h did not get stamped"; exit 1; }
          echo "OK: packaged AppImage launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        run: packaging/stage_data.sh --verify squashfs-root/usr/share/POM2

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          # From usr/, pom2_headless resolves roms/ the way the INSTALLED
          # binary does (<exe>/../share/POM2/roms) — so this exercises the
          # package's asset resolution, not a CWD accident.
          cd squashfs-root/usr
          bin/pom2_headless --version
          bin/pom2_headless --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          bin/pom2_headless --frames 300 --screenshot boot.ppm
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ------------------------------------------------- Linux ARM64 (generic) ----
  # Built on GitHub's NATIVE arm64 runner with NO container, which is the whole
  # difference from the `raspberry` job below: the glibc floor becomes the
  # runner's (2.39), and the GL tier stays desktop OpenGL. That serves current
  # ARM desktops and servers — Ubuntu 24.04+, Fedora 40+, Debian trixie — where
  # a GLES build would be the wrong tier and the Pi's 2.36 floor buys nothing.
  #
  # Pi users take the `raspberry` package. The names say which is which, and the
  # name check below makes sure they stay distinguishable.
  linux-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config file desktop-file-utils wget \
            libglfw3-dev libgl1-mesa-dev libslirp-dev

      - name: Build + AppImage (native arm64, desktop GL)
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
          POM2_JOBS: 2
        run: packaging/linux/build_native_arm64.sh

      - name: Verify the AppImage — name, aarch64, ET_EXEC, no bundled GL
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage | head -1)
          echo "Package: $APP"
          # Bare `-aarch64`: the Pi packages carry their own tags. A collision
          # here would silently replace one of them in the publish staging dir.
          case "$APP" in
            *-raspberry-aarch64.AppImage|*-pi400-aarch64.AppImage)
              echo "ERROR: $APP carries a Pi variant tag — this is the generic build"; exit 1 ;;
            *-aarch64.AppImage) ;;
            *) echo "ERROR: $APP is not named -aarch64.AppImage"; exit 1 ;;
          esac
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          test "$TYPE" = "EXEC" \
            || { echo "ERROR: runtime is $TYPE, not EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" \
            || { echo "ERROR: bad AppImage magic $MAGIC"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM2
          readelf -h "$BIN" | grep -q AArch64 \
            || { echo "ERROR: POM2 is not an AArch64 binary"; exit 1; }
          # libstdc++ must be STATIC — linuxdeploy blacklists libstdc++.so.6 and
          # will never bundle it, so a dynamic GLIBCXX dependency is an
          # unsatisfiable requirement on any host older than this runner.
          GXX=$(objdump -T "$BIN" | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -1 || true)
          test -z "$GXX" || { echo "ERROR: libstdc++ is dynamically linked ($GXX)"; exit 1; }
          # Graphics drivers come from the HOST, never the bundle.
          if ls squashfs-root/usr/lib/ 2>/dev/null | grep -qE '^lib(GL|EGL|GLX|OpenGL|GLdispatch)\.'; then
            echo "ERROR: the AppImage bundles a graphics-driver library:"
            ls squashfs-root/usr/lib/ | grep -E '^lib(GL|EGL|GLX|OpenGL|GLdispatch)\.'
            exit 1
          fi
          echo "OK: generic aarch64 AppImage"

      - name: Install runtime GL/X libs for the launch smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--help)
        run: |
          set -euo pipefail
          test -x squashfs-root/AppRun || { echo "ERROR: squashfs-root/AppRun missing"; exit 1; }
          OUT=$(./squashfs-root/AppRun --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print its usage"; exit 1; }
          echo "OK: packaged aarch64 AppImage launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        run: packaging/stage_data.sh --verify squashfs-root/usr/share/POM2

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          cd squashfs-root/usr
          bin/pom2_headless --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          bin/pom2_headless --frames 300 --screenshot boot.ppm
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-linux-arm64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # -------------------------------------------------- Raspberry Pi (arm64) ----
  # Same shape as `linux`, three Pi-driven differences (see
  # packaging/linux/build_in_bookworm_arm64.sh):
  #   1. runs-on: ubuntu-24.04-arm — GitHub's NATIVE arm64 runner (free on
  #      public repos). No QEMU, so this compiles at full speed.
  #   2. A debian:bookworm container, because Raspberry Pi OS IS bookworm and an
  #      AppImage's glibc floor is the build image's. The runner's own
  #      ubuntu-24.04-arm userland would stamp GLIBC_2.39 and the package would
  #      not start on a single Pi. Bookworm's 2.36 covers Pi OS bookworm/trixie.
  #   3. -DPOM2_GLES=ON — the tier the hardware actually exposes.
  #
  # The builder image IS pinned — dated tag AND digest. "debian:bookworm" is a
  # moving tag: it is rebuilt on every point release, so two runs of the same
  # git tag could produce packages with different glibc/libstdc++ contents and
  # no way to tell which one a user has. A release job whose inputs move is not
  # a repeatable release. Refresh the pin deliberately (get the digest with
  # `docker buildx imagetools inspect debian:bookworm`) and say so in the
  # commit; both arm64 jobs below and .github/workflows/pi400.yml use the same
  # line, so they move together.
  raspberry:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build POM2 + AppImage in a bookworm arm64 container (GLES)
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POM2_VERSION \
            debian:bookworm-20260824@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 \
            bash /work/packaging/linux/build_in_bookworm_arm64.sh

      - name: Verify the AppImage — aarch64, ET_EXEC, glibc <= 2.36, GLES-only
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage | head -1)
          echo "Package: $APP"
          # The name must carry the `raspberry` VARIANT, not just the arch: the
          # release also publishes a generic aarch64 AppImage and a pi400 one,
          # and the publish job flattens every artifact into one directory. Two
          # same-named files would silently overwrite each other — handing Pi
          # users a package that will not start, or ARM desktop users the GLES
          # build.
          case "$APP" in
            *-raspberry-aarch64.AppImage) ;;
            *) echo "ERROR: $APP is not named -raspberry-aarch64.AppImage"; exit 1 ;;
          esac
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          test "$TYPE" = "EXEC" \
            || { echo "ERROR: runtime is $TYPE, not EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" \
            || { echo "ERROR: bad AppImage magic $MAGIC"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM2
          MACH=$(readelf -h "$BIN" | awk -F': +' '/Machine:/ {print $2; exit}')
          echo "POM2 ELF machine: $MACH"
          grep -q AArch64 <<<"$MACH" \
            || { echo "ERROR: POM2 is not an AArch64 binary"; exit 1; }
          MAX=$(objdump -T "$BIN" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Highest glibc symbol required by POM2: ${MAX:-none}"
          test "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.36" \
            || { echo "ERROR: requires ${MAX} > GLIBC_2.36 — will not run on Pi OS"; exit 1; }
          # THE point of this job: the GLES package must never pull desktop
          # libGL. On a Pi that library is the software rasteriser, so depending
          # on it would be a silent ~2 fps regression rather than a link error.
          if ldd "$BIN" | grep -qE 'lib(GL|OpenGL)\.so'; then
            echo "ERROR: packaged POM2 links desktop libGL"; ldd "$BIN" | grep -E 'GL|EGL'; exit 1
          fi
          ldd "$BIN" | grep -E 'GLES|EGL' \
            || { echo "ERROR: POM2 does not link GLESv2 — is POM2_GLES really on?"; exit 1; }
          echo "OK: aarch64 + ET_EXEC + glibc <= 2.36 + GLES-only"

      - name: Install runtime GLES/X libs for the launch smoke
        run: |
          set -eu
          # GLESv2/EGL here instead of libGL — this package's whole point. EGL
          # must be present because GLFW dlopens it for GLFW_EGL_CONTEXT_API.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgles2 libegl1 libglx0 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--help)
        run: |
          set -euo pipefail
          # Runs AppRun from the already-extracted squashfs-root — same reason as
          # the x86_64 job: immune to an AppImageLauncher interception, and
          # reproducible by hand. 2>&1 because POM2 prints to stderr.
          test -x squashfs-root/AppRun || { echo "ERROR: squashfs-root/AppRun missing"; exit 1; }
          OUT=$(./squashfs-root/AppRun --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print its usage"; exit 1; }
          echo "OK: packaged aarch64 AppImage launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        run: packaging/stage_data.sh --verify squashfs-root/usr/share/POM2

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          # glibc is forward-compatible, so the 2.36-built binary runs on this
          # 2.39 runner. The GLES linkage is irrelevant here: pom2_headless has
          # no display back-end at all, it renders into a CPU buffer.
          cd squashfs-root/usr
          bin/pom2_headless --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          bin/pom2_headless --frames 300 --screenshot boot.ppm
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-raspberry-arm64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # -------------------------------------------- Raspberry Pi 4 / Pi 400 -------
  # The core-specific twin of `raspberry`, and that is the entire difference:
  # `raspberry` is GENERIC aarch64 (no -mcpu) because it must run from a Pi 3 to
  # a Pi 5; this one compiles -mcpu=cortex-a72 and will NOT start on an older
  # core. Both are published; the name says which to take.
  #
  # It also compiles in TWO profile-guided passes and then with LTO — measured
  # −39 % on a CPU-bound load and −29 % on a disk-active one, same sources, same
  # output (docs/PERFORMANCE.md). That is where the 120-minute budget goes. The
  # training runs HERE, on the ARM64 runner, so a Pi never pays for it.
  #
  # Promoted from pi400.yml (which stays, as the on-demand per-core builder for
  # cortex-a76 / a53 and the Pi OS Lite tarball) into the release so the package
  # ships on every tag rather than needing someone to remember a manual run.
  pi400:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build -mcpu=cortex-a72 + PGO + LTO in a bookworm arm64 container
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
          POM2_MCPU: cortex-a72
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POM2_VERSION -e POM2_MCPU \
            debian:bookworm-20260824@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443 \
            bash /work/packaging/raspberry/build_in_bookworm_pi.sh

      - name: Verify the AppImage — name, aarch64, glibc <= 2.36, GLES-only
        run: |
          set -euo pipefail
          APP=$(ls dist/*-pi400-aarch64.AppImage | head -1)
          echo "Package: $APP"
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          test "$TYPE" = "EXEC" || { echo "ERROR: runtime is $TYPE, not EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" || { echo "ERROR: bad AppImage magic $MAGIC"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM2
          readelf -h "$BIN" | grep -q AArch64 \
            || { echo "ERROR: POM2 is not an AArch64 binary"; exit 1; }
          MAX=$(objdump -T "$BIN" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Highest glibc symbol required by POM2: ${MAX:-none}"
          test "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.36" \
            || { echo "ERROR: requires ${MAX} > GLIBC_2.36 — will not run on Pi OS"; exit 1; }
          if ldd "$BIN" | grep -qE 'lib(GL|OpenGL)\.so'; then
            echo "ERROR: packaged POM2 links desktop libGL"; ldd "$BIN" | grep -E 'GL|EGL'; exit 1
          fi
          ldd "$BIN" | grep -E 'GLES|EGL' \
            || { echo "ERROR: POM2 does not link GLESv2 — is POM2_GLES really on?"; exit 1; }
          echo "OK: pi400 AppImage (-mcpu=cortex-a72, glibc <= 2.36, GLES-only)"

      - name: Install runtime GLES/X libs for the launch smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgles2 libegl1 libglx0 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--help)
        run: |
          set -euo pipefail
          # The ubuntu-24.04-arm runner is a Neoverse: it EXECUTES cortex-a72
          # code (same ARMv8-A ISA; -mcpu only schedules and picks extensions
          # that are already present). So this is a real launch, not a symbolic
          # one — the same reason NeoST's pi400 job trusts its own smoke.
          test -x squashfs-root/AppRun || { echo "ERROR: squashfs-root/AppRun missing"; exit 1; }
          OUT=$(./squashfs-root/AppRun --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print its usage"; exit 1; }
          echo "OK: packaged pi400 AppImage launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        run: packaging/stage_data.sh --verify squashfs-root/usr/share/POM2

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          cd squashfs-root/usr
          bin/pom2_headless --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          bin/pom2_headless --frames 300 --screenshot boot.ppm
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-pi400-arm64-AppImage
          path: dist/*-pi400-aarch64.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS ----
  # ONE Universal 2 (arm64 + x86_64) .dmg — native on Apple Silicon AND Intel,
  # no Rosetta anywhere. Runs on the arm64 image; the x86_64 slice is
  # cross-compiled, which the Apple toolchain does natively.
  #
  # GLFW is built from source as a universal STATIC library rather than taken
  # from Homebrew. Homebrew is single-arch, and worse, the linker bakes brew's
  # absolute prefix into the binary — so a brew-linked app looks for
  # /usr/local/opt/glfw/... which does not exist on Apple Silicon (brew is
  # /opt/homebrew there). That fails in dyld, which Finder reports as the
  # useless "POM2 quit unexpectedly", and CI cannot catch it because the runner
  # itself has brew glfw at exactly that path.
  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Dear ImGui (pinned commit)
        run: tools/fetch_imgui_pinned.sh

      - name: Build universal static GLFW (arm64 + x86_64)
        run: packaging/macos/build_universal_deps.sh --out build-universal-deps

      - name: Package universal .app + .dmg
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
          POM2_MACOS_ARCHS: arm64;x86_64
          # CMake honours CMAKE_PREFIX_PATH from the environment — this is what
          # points find_package(glfw3) at the universal static build instead of
          # whatever Homebrew copy happens to be on the image.
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/build-universal-deps/glfw
        run: ./package_macos_release.sh

      - name: Smoke-launch the packaged .app binary (--help)
        run: |
          set -euo pipefail
          # Proves the bundled binary starts and every dependency resolves.
          # This exercises the arm64 slice (the runner's own arch); the x86_64
          # slice is verified structurally by the lipo gate inside the packager
          # — GitHub's arm64 macOS images ship without Rosetta, so it cannot be
          # executed here.
          OUT=$(dist/POM2.app/Contents/MacOS/POM2 --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: .app binary did not print its usage"; exit 1; }
          echo "OK: packaged .app binary launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        run: packaging/stage_data.sh --verify dist/POM2.app/Contents/Resources

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          # From Contents/, ResourcePaths probes <exe>/../share/POM2/roms, which
          # the packager's `share -> Resources` and `Resources/POM2 -> .`
          # symlinks resolve to Contents/Resources/roms. So this also proves
          # those two symlinks survived into the bundle.
          cd dist/POM2.app/Contents
          MacOS/pom2_headless --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          MacOS/pom2_headless --frames 300 --screenshot boot.ppm
          # The .dmg is already built, but do not leave a capture in the .app.
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-macOS-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ----
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Dear ImGui (pinned commit)
        shell: bash
        run: tools/fetch_imgui_pinned.sh

      - name: Install GLFW via vcpkg (manifest mode, static triplet)
        # x64-windows-static, NOT the default x64-windows: this triplet carries
        # VCPKG_CRT_LINKAGE=static, so GLFW is compiled /MT and matches POM2's
        # own static CRT (POM2_WIN_STATIC_RUNTIME, ON by default). The result is
        # one self-contained POM2.exe with no DLL beside it. Do NOT switch to
        # -static-md: that keeps the CRT dynamic and puts the app-local DLL back.
        #
        # NO package argument: the dependency and its pinned version live in the
        # repo-root vcpkg.json (manifest mode). Passing `glfw3:x64-windows-static`
        # here is an error, not a synonym — vcpkg rejects package arguments in
        # manifest mode.
        run: vcpkg install --triplet x64-windows-static

      - name: Configure + build (Release, vcpkg toolchain)
        shell: cmd
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DPOM2_ENABLE_TESTS=OFF
          cmake --build build --config Release --parallel 2

      - name: Package ZIP
        shell: cmd
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: call package_windows_release.bat

      - name: Verify POM2.exe is self-contained (no DLL, clean import table)
        # The bug this guards against is NOT reproducible in CI (runners have no
        # vendor GPU and fall back to software GL), so the guarantee is
        # structural: zero DLLs in the package root, and an import table naming
        # no CRT and no GLFW.
        shell: bash
        run: |
          set -euo pipefail
          # (1) Not one DLL at the package root.
          STRAY=$(find dist/POM2-Windows -maxdepth 1 -iname '*.dll' -printf '%f\n' || true)
          if [ -n "$STRAY" ]; then
            echo "ERROR: DLLs found next to POM2.exe — the exe must be self-contained:"
            echo "$STRAY"; exit 1
          fi
          # (2) Import table must name no CRT and no GLFW. dumpbin lives inside
          #     the MSVC toolset; vswhere finds it without hardcoding a version.
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          DUMPBIN=""
          if [ -x "$VSWHERE" ]; then
            DUMPBIN=$("$VSWHERE" -latest -find '**\dumpbin.exe' | head -n 1 | tr -d '\r' || true)
          fi
          if [ -n "$DUMPBIN" ] && [ -f "$DUMPBIN" ]; then
            IMPORTS=$("$DUMPBIN" //dependents dist/POM2-Windows/POM2.exe)
            echo "$IMPORTS"
            BAD=$(echo "$IMPORTS" | grep -iE 'vcruntime|msvcp|api-ms-win-crt|glfw3' || true)
            if [ -n "$BAD" ]; then
              echo "ERROR: POM2.exe still imports a runtime/GLFW DLL:"; echo "$BAD"; exit 1
            fi
            echo "OK: import table names no CRT and no GLFW DLL"
          else
            # Never silently pass: say plainly which half of the check ran.
            echo "NOTE: dumpbin not found — the zero-DLL check ran, the import-table check did not"
          fi

      - name: Smoke-launch the packaged POM2.exe (--help)
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(dist/POM2-Windows/POM2.exe --help 2>&1)
          echo "$OUT"
          grep -q "Usage: POM2" <<<"$OUT" \
            || { echo "ERROR: POM2.exe did not print its usage"; exit 1; }
          echo "OK: packaged POM2.exe launches"

      - name: Verify the package payload (manifest present, nothing leaked)
        shell: bash
        run: packaging/stage_data.sh --verify dist/POM2-Windows

      - name: Boot smoke — the packaged binary runs an Apple II and draws a frame
        shell: bash
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          cd dist/POM2-Windows
          ./pom2_headless.exe --version | grep -qF "v${POM2_VERSION}" \
            || { echo "ERROR: packaged binary does not announce v${POM2_VERSION}"; exit 1; }
          ./pom2_headless.exe --frames 300 --screenshot boot.ppm
          rm -f boot.ppm

      - uses: actions/upload-artifact@v5
        with:
          name: POM2-Windows-zip
          path: dist/*.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- WASM ----
  # The browser bundle, shipped as a downloadable zip so the demo can be run
  # from any static host (or offline) rather than only from the project's own
  # Pages deployment.
  #
  # Payload note: the WASM bundle is the one package that carries floppyemu/ —
  # `wasm/shell.html` boots `floppyemu/Total Replay v6.1.hdv` by default, so it
  # IS the demo's boot disk. Desktop packages skip it (packaging/bundle.manifest
  # marks it `wasm`), which is why they weigh ~6 MB and this weighs ~35 MB.
  wasm:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Pinned, not `latest`. The WASM bundle published with a tag has to be
      # reproducible from that tag, and `latest` silently re-toolchains it: a
      # new Emscripten can change the generated JS glue, the pthread shape and
      # the .data packer. Bump this deliberately, in its own commit.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      - name: Build the WASM bundle
        run: ./build_wasm.sh

      - name: Verify the bundle — files present, size bounded
        run: |
          set -euo pipefail
          for f in index.html POM2.js POM2.wasm POM2.data; do
            test -s "wasm/$f" || { echo "ERROR: wasm/$f is missing or empty"; exit 1; }
          done
          # Size bound. The manifest payload plus floppyemu/ lands near 35 MB;
          # a jump past 60 MB means a deny-listed folder (disks_5.4 at 192 MB,
          # hdv at 130 MB) found its way into POM2.data — which nothing else
          # here would notice, since a fat bundle still works locally and only
          # fails once it meets GitHub Pages' limits and a user's bandwidth.
          TOTAL=$(du -cb wasm/index.html wasm/POM2.js wasm/POM2.wasm wasm/POM2.data \
                  | tail -1 | cut -f1)
          echo "Bundle size: $TOTAL bytes"
          test "$TOTAL" -lt 60000000 \
            || { echo "ERROR: bundle > 60 MB — did a large folder leak into POM2.data?"; exit 1; }

      - name: Zip the bundle
        env:
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd wasm && zip -9 "../dist/POM2-v${POM2_VERSION}-web-wasm.zip" \
                index.html POM2.js POM2.wasm POM2.data)
          ls -lh dist/*.zip

      # The online demo is not this zip: ci.yml's `pages` job deploys the
      # bundle it builds on every push to main, so nothing here has to be
      # committed back (the freshness guard that used to sit below went with
      # the committed wasm/ copy, 2026-08-23).
      - uses: actions/upload-artifact@v5
        with:
          name: POM2-web-wasm
          path: dist/*-web-wasm.zip
          if-no-files-found: error

  # ------------------------------------------------ attach to the Release ----
  publish:
    needs: [version, quality, linux, linux-arm64, raspberry, pi400, macos, windows, wasm]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    # The ONLY job that needs to write: it creates the Release and attaches the
    # packages. Everything above builds with a read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Attach packages + checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          POM2_VERSION: ${{ needs.version.outputs.pom2_version }}
          # This job deliberately does NOT check out the repo — it only needs the
          # downloaded artifacts. But `gh release` infers the target repo from the
          # git remote, so without a checkout every call would die with "failed to
          # run git: fatal: not a git repository". GH_REPO states it explicitly.
          # (The release notes are fetched through the API for the same reason —
          # see below — so this job still needs no working tree.)
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Flatten the per-job artifact dirs into one staging dir so the
          # checksum file lists clean basenames rather than nested paths. Each
          # package basename is already unique per OS.
          mkdir -p staging
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) \
               -exec cp -v {} staging/ \;
          shopt -s nullglob
          FILES=(staging/*.AppImage staging/*.dmg staging/*.zip)
          # Exactly SEVEN, not "at least one". The staging directory is flat, so
          # two packages that ended up with the same name would leave six here
          # and the Release would quietly ship one platform twice and another
          # not at all — the precise failure the per-job name checks guard
          # against upstream, caught again at the last possible moment.
          printf '%s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -ne 7 ]; then
            echo "ERROR: ${#FILES[@]} package(s) staged, expected 7."
            echo "       Expected: x86_64 / aarch64 / raspberry-aarch64 /"
            echo "                 pi400-aarch64 AppImages, macOS .dmg,"
            echo "                 Windows .zip, web-wasm .zip"
            exit 1
          fi
          # SHA-256 manifest so downloaders can verify with `sha256sum -c`.
          ( cd staging && sha256sum -- "${FILES[@]#staging/}" > SHA256SUMS.txt )
          cat staging/SHA256SUMS.txt
          FILES+=(staging/SHA256SUMS.txt)

          # Release body: the hand-written notes for this version when the tag
          # carries them, GitHub's generated commit list otherwise. Read from
          # the API AT THE TAG rather than from a checkout — the job has no
          # working tree by design (above), and pinning to the tag means the
          # notes that ship are the ones that were reviewed with the code.
          # ⚠ On a 404 `gh api` writes its JSON error to STDOUT, so notes.md is
          # non-empty even when the file does not exist — the EXIT CODE is what
          # decides, and the failed body is deleted so a later edit cannot pick
          # it up by accident.
          # Try v<major.minor.patch>.md first, then v<major.minor>.md — BOTH
          # conventions exist under docs/releases/ (v0.8.md next to v0.8.3.md)
          # and CLAUDE.md documents the second, so looking for only one of them
          # silently downgraded a release that HAD hand-written notes.
          NOTES_CANDIDATES=("docs/releases/v${POM2_VERSION}.md")
          case "$POM2_VERSION" in
            *.*.*) NOTES_CANDIDATES+=("docs/releases/v${POM2_VERSION%.*}.md") ;;
          esac
          NOTES_ARGS=(--generate-notes)
          NOTES_PATH=""
          for _cand in "${NOTES_CANDIDATES[@]}"; do
              if gh api "repos/${GH_REPO}/contents/${_cand}?ref=${TAG}" \
                     -H "Accept: application/vnd.github.raw" > notes.md 2>/dev/null &&
                 [ -s notes.md ]; then
                  NOTES_ARGS=(--notes-file notes.md)
                  NOTES_PATH="$_cand"
                  echo "Release body from ${_cand} ($(wc -l < notes.md) lines)."
                  break
              fi
              rm -f notes.md
          done
          if [ -z "$NOTES_PATH" ]; then
              # Loud, not silent. Falling back to a generated commit list is a
              # real downgrade of the release body and used to leave no trace
              # anywhere but a buried log line.
              echo "::warning title=No hand-written release notes::Looked for ${NOTES_CANDIDATES[*]} at ${TAG}; using GitHub's generated commit list instead."
              { echo "⚠ No hand-written release notes found at \`${TAG}\` (tried: ${NOTES_CANDIDATES[*]}). The Release body is a generated commit list."; } \
                >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
              # Release already exists: add assets, and never overwrite a body
              # someone has edited. But an EMPTY body is the signature of a
              # previous failed run of this job, and re-running it used to
              # throw NOTES_ARGS away and leave the release permanently
              # bodiless — so fill that one in.
              gh release upload "$TAG" "${FILES[@]}" --clobber
              if [ -n "$NOTES_PATH" ] &&
                 [ -z "$(gh release view "$TAG" --json body -q .body | tr -d '[:space:]')" ]; then
                  echo "Existing release has an empty body — setting it from ${NOTES_PATH}."
                  gh release edit "$TAG" --notes-file notes.md
              fi
          else
              gh release create "$TAG" "${FILES[@]}" "${NOTES_ARGS[@]}" \
                                --title "POM2 $TAG"
          fi
