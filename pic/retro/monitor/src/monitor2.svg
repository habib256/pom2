<svg xmlns="http://www.w3.org/2000/svg" width="690" height="512" viewBox="0 0 690 512">
<title>POM2 Monitor II bezel, matching the hard disk's beige case</title>
<!-- The tube opening (transparent) is the rounded rectangle x=41 y=40
     w=608 h=432 rx=30; the emulator draws the CRT glass under it. -->
<defs>
  <linearGradient id="top" x2="0" y2="1">
    <stop offset="0" stop-color="#938a77"/><stop offset="1" stop-color="#776f60"/>
  </linearGradient>
  <linearGradient id="bottom" x2="0" y2="1">
    <stop offset="0" stop-color="#b7ae97"/><stop offset="1" stop-color="#d9d0b9"/>
  </linearGradient>
  <linearGradient id="left" x2="1" y2="0">
    <stop offset="0" stop-color="#b7ae97"/><stop offset="1" stop-color="#a79e88"/>
  </linearGradient>
  <linearGradient id="right" x2="1" y2="0">
    <stop offset="0" stop-color="#a79e88"/><stop offset="1" stop-color="#cbc2ab"/>
  </linearGradient>
  <mask id="tube">
    <rect width="690" height="512" fill="white"/>
    <rect x="41" y="40" width="608" height="432" rx="30" fill="black"/>
  </mask>
</defs>
<g mask="url(#tube)">
  <!-- Case front: a thin beige border -->
  <rect width="690" height="512" rx="6" fill="#cbc2ab"/>
  <rect x="1" y="1" width="688" height="510" rx="6" fill="none" stroke="#e9e1cc" stroke-width="2"/>
  <!-- Recessed bezel: edge of the opening in the case -->
  <rect x="14" y="14" width="662" height="484" rx="4" fill="#9c9482"/>
  <rect x="13" y="13" width="664" height="486" rx="5" fill="none" stroke="#e9e1cc" stroke-width="1.5"/>
  <!-- Funnel faces down to the tube: shaded top, lit bottom -->
  <path d="M15 15H675L647 38H43Z" fill="url(#top)"/>
  <path d="M15 497H675L647 474H43Z" fill="url(#bottom)"/>
  <path d="M15 15L43 38V474L15 497Z" fill="url(#left)"/>
  <path d="M675 15L647 38V474L675 497Z" fill="url(#right)"/>
  <path d="M15 15L43 38M675 15L647 38M15 497L43 474M675 497L647 474" stroke="#444039" stroke-width="1" opacity=".6"/>
  <!-- Dark rim of the tube -->
  <rect x="37" y="36" width="616" height="440" rx="34" fill="#141815"/>
  <rect x="37" y="36" width="616" height="440" rx="34" fill="none" stroke="#444039" stroke-width="1.5"/>
</g>
</svg>
