<linearGradient id="top" x2="0" y2="1"><stop stop-color="#e9e1cc"/><stop offset="1" stop-color="#c9c0ab"/></linearGradient>
<linearGradient id="latch" x2="0" y2="1"><stop stop-color="#e1d9c2"/><stop offset=".65" stop-color="#c6bda5"/><stop offset="1" stop-color="#b3aa95"/></linearGradient>
<linearGradient id="recess" x2="0" y2="1"><stop stop-color="#827967"/><stop offset="1" stop-color="#d8cfb8"/></linearGradient>
</defs>
<rect x="26" y="62" width="953" height="350" rx="16" fill="#211f1c" opacity=".3"/>
<rect x="110" y="386" width="780" height="31" rx="8" fill="#948b78"/>
