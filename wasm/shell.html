<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POM2 — Apple II Emulator (WASM)</title>
<style>
  html, body { margin: 0; padding: 0; background: #181820; color: #ddd;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
               overflow: hidden; height: 100%; }
  #status   { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
              max-width: min(640px, calc(100vw - 32px)); padding: 12px 16px;
              background: rgba(12,12,18,0.92); border: 1px solid #3a3a48;
              border-radius: 8px; font-size: 14px; line-height: 1.4;
              pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.45);
              z-index: 10; }
  #status.hidden { display: none; }
  #progress { display: inline-block; width: 220px; height: 6px;
              background: #2a2a36; border-radius: 3px; overflow: hidden;
              vertical-align: middle; margin-left: 6px; }
  #progress > div { background: #5aa8ff; height: 100%; width: 0%;
                    transition: width 0.1s linear; }
  #bootSplash { position: fixed; inset: 0; display: grid; place-items: center;
                background: #000; color: #f0f0f0; z-index: 5;
                font: 700 clamp(28px, 7vw, 72px) ui-monospace, monospace;
                letter-spacing: 0.08em; text-align: center; }
  #bootSplash.hidden { display: none; }
  /* The whole page: main.cpp sizes the GLFW window (and so the ImGui
     DockSpace) to this box and follows every resize. The Apple II screen
     keeps its own aspect inside its window. */
  canvas    { position: fixed; inset: 0; display: block;
              width: 100vw; height: 100vh;
              background: #000; cursor: default; outline: none; }
  #err      { position: fixed; left: 16px; right: 16px; top: 16px;
              padding: 12px 16px; background: #4a1a1a; color: #ffe;
              border-radius: 6px; font-family: ui-monospace, monospace;
              font-size: 12px; white-space: pre-wrap; display: none;
              z-index: 20; }
  .pill     { display: inline-block; padding: 2px 8px; border-radius: 9px;
              background: #2a2a36; font-size: 11px; margin-right: 6px; }
  /* Back to the project from a deep link (a game's "play in the browser"):
     bottom-right, above the canvas and the splash, quiet until hovered. */
  #repoLink { position: fixed; right: 8px; bottom: 8px; z-index: 15;
              padding: 3px 9px; border-radius: 9px; font-size: 12px;
              background: rgba(12,12,18,0.75); color: #9ab;
              text-decoration: none; opacity: 0.7; }
  #repoLink:hover, #repoLink:focus { opacity: 1; color: #fff; }
</style>
</head>
<body>
<div id="status">
  <span class="pill">POM2 WASM</span>
  <span id="statusMsg">Loading POM2: downloading assets and initializing the emulator…</span>
  <span id="progress"><div></div></span>
</div>
<div id="err"></div>
<div id="bootSplash">PLEASE WAIT</div>
<a id="repoLink" href="https://github.com/habib256/pom2" target="_blank"
   rel="noopener" title="POM2 on GitHub">POM2 — Apple II emulator ↗</a>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  // Single-threaded WASM by design — no SharedArrayBuffer / COOP/COEP
  // dependency, so the page boots on any static host (GitHub Pages,
  // Cloudflare Pages, plain S3, …) with no header tweaking.

  const statusEl   = document.getElementById('statusMsg');
  const progressEl = document.querySelector('#progress > div');
  const errEl      = document.getElementById('err');
  function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }
  function setProgress(num, total) {
    if (!progressEl || !total) return;
    progressEl.style.width = Math.min(100, (100 * num / total)) + '%';
  }
  window.pom2FirstFrameReady = function() {
    document.getElementById('bootSplash').classList.add('hidden');
    setProgress(1, 1);
    setStatus("POM2 ready.");
    setTimeout(() => {
      document.getElementById('status').classList.add('hidden');
    }, 250);
  };

  // Default WASM experience: the PAL Apple //c
  // auto-booting DIX — the French Touch demo anthology, GPLv3, POM2's
  // priority benchmark — from bundled_disks/DIX-fix.po. It replaced Total
  // Replay (commercial titles, removed from the tree 2026-09-05; the shell
  // kept pointing at the deleted file, so the demo 404'd on boot).
  // Both knobs are URL-overridable so a deeplink can pick a different
  // profile or disk without rebuilding. The disk path must resolve inside
  // POM2.data — roms/, fonts/, named artwork, floppyemu/ and the curated
  // bundled_disks/ entries ship by default;
  // disks_3.5/ is bundled only when built with --with-data
  // (-DPOM2_WASM_BUNDLE_DISKS=ON):
  //   ?preset=iie&disk=disks_3.5/A2DeskTop-1.5-en_800k.2mg   (needs --with-data)
  //   ?preset=ii%2B&nodisk=1  (II+ without a boot image; encode + as %2B)
  //   ?nodisk=1          (keep the preset, skip the disk arg)
  // ?url= boots an image from anywhere the browser may fetch it (the host
  // must send CORS headers — raw.githubusercontent.com does), so a game
  // repository can link "play in the browser" without POM2 shipping its disk:
  //   ?preset=ii%2B&url=https://raw.githubusercontent.com/habib256/pom2games/main/dist/SNAKE.dsk
  // It wins over ?disk= and ?nodisk=. The download starts now, alongside
  // POM2.data; preRun below holds main() until it lands in MEMFS.
  const _qs = new URLSearchParams(window.location.search);
  const _preset = _qs.get('preset') || 'iic-pal';
  const _url    = _qs.get('url');
  const _disk   = (_url || _qs.get('nodisk') === '1') ? null
                 : (_qs.get('disk') || 'bundled_disks/DIX-fix.po');
  const _args = ['--preset', _preset];
  if (_disk) _args.push(_disk);

  // Same bounds and extensions as File > Import disk (browser_files.js): the
  // CLI routes the positional by its extension, so the name must keep it.
  const _urlDiskLimit = 64 * 1024 * 1024;
  const _urlDiskExt = /\.(dsk|do|d13|po|nib|woz|moof|2mg|hdv|image)$/i;
  const _urlDisk = _url ? (async function() {
    let target;
    try { target = new URL(_url, window.location.href); }
    catch (e) { throw new Error('not a valid URL'); }
    if (target.protocol !== 'https:' && target.protocol !== 'http:')
      throw new Error('only http(s) URLs are accepted');
    const name = decodeURIComponent(target.pathname.split('/').pop() || '');
    if (!_urlDiskExt.test(name))
      throw new Error('the file name must end in .dsk, .do, .d13, .po, .nib, ' +
                      '.woz, .moof, .2mg, .hdv or .image');
    let response;
    try { response = await fetch(target.href, { mode: 'cors', credentials: 'omit' }); }
    catch (e) {
      throw new Error('download failed (network error, or the server does ' +
                      'not allow cross-origin requests)');
    }
    if (!response.ok) throw new Error('download failed: HTTP ' + response.status);
    const declared = Number(response.headers.get('Content-Length') || 0);
    if (declared > _urlDiskLimit) throw new Error('image exceeds 64 MiB');
    const bytes = new Uint8Array(await response.arrayBuffer());
    if (bytes.length > _urlDiskLimit) throw new Error('image exceeds 64 MiB');
    if (bytes.length === 0) throw new Error('the server returned an empty file');
    return { name: name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-128), bytes };
  })() : null;
  // Keep a rejection from reaching the page-wide unhandledrejection handler
  // before preRun looks at it: a bad link is reported and the machine boots
  // without a disk, it is not a load failure.
  if (_urlDisk) _urlDisk.catch(function() {});

  var Module = {
    // The app reads assets from MEMFS itself. Do not let Emscripten's
    // preload plugins ask the browser to decode bundled images/audio during
    // startup, because a decoder failure aborts the whole .data load.
    noImageDecoding: true,
    noAudioDecoding: true,
    arguments: _args,
    canvas: (function() {
      const c = document.getElementById('canvas');
      // ContextLost recovery is the user's problem (refresh tab).
      // NOTE: no preventDefault() here. Cancelling this event is the page
      // PROMISING the browser it will rebuild every GL object when
      // 'webglcontextrestored' fires — and nothing here can: the GL objects
      // belong to the wasm module, which has no restore path. Cancelling it
      // and then not restoring leaves the canvas in a half-alive state with a
      // restore event nobody listens to. Letting the default through makes the
      // loss final, which is exactly what the message below tells the user.
      c.addEventListener('webglcontextlost', () => {
        errEl.style.display = 'block';
        errEl.textContent = 'WebGL context lost. Reload the page.';
      }, false);
      return c;
    })(),
    print:   (text) => { console.log(text); },
    printErr:(text) => { console.warn(text); },
    setStatus: (text) => {
      // Emscripten posts "Downloading data... (n/total)" — parse it.
      if (!text) {
        setStatus("Loading POM2: initializing the emulator…");
        return;
      }
      const m = text.match(/\((\d+)\/(\d+)\)/);
      if (m) {
        setProgress(parseInt(m[1]), parseInt(m[2]));
        setStatus("Loading POM2: downloading assets… " + m[1] + " / " + m[2]);
      } else {
        setStatus("Loading POM2: " + text);
      }
    },
    monitorRunDependencies: function(left) {
      if (left === 0) {
        setProgress(1, 1);
        setStatus("Loading POM2: assets loaded, initializing the emulator…");
      }
    },
    onAbort: function(reason) {
      errEl.style.display = 'block';
      errEl.textContent = "POM2 failed while loading or initializing:\n" + reason;
    },
  };
  window.addEventListener('unhandledrejection', event => {
    errEl.style.display = 'block';
    errEl.textContent = "POM2 failed while loading or initializing:\n" +
      (event.reason && (event.reason.stack || event.reason.message || event.reason));
  });
  // Persistent settings: mount IndexedDB at /persistent, where the emulator
  // keeps state.cfg and imgui.ini (pom2::userConfigDir()).
  //
  // The populate MUST hold up the runtime. FS.syncfs is asynchronous, and
  // this hook used to fire it and return: main() then ran Settings::load()
  // against a mount that was still empty, so every visit looked like a first
  // visit no matter what had been stored — and the empty settings were saved
  // back over the good ones a moment later. addRunDependency is Emscripten's
  // supported way to say "not yet"; the matching remove is what lets run()
  // proceed, so it has to happen on EVERY path out of the callback.
  // The last moments the browser reliably gives a page. Neither event can
  // wait for an async write, so this is the belt to the heartbeat's braces:
  // the emulator also persists every 10 s while the tab is visible.
  const pom2PersistNow = function() {
    try {
      if (Module._pom2_persist_now) Module._pom2_persist_now();
    } catch (e) { /* runtime not up yet, or already torn down */ }
  };
  document.addEventListener('visibilitychange', function() {
    const hidden = document.visibilityState === 'hidden';
    if (Module._pom2_set_page_visible)
      Module._pom2_set_page_visible(hidden ? 0 : 1);
    if (hidden) pom2PersistNow();
  });
  window.addEventListener('pagehide', function() {
    if (Module._pom2_set_page_visible) Module._pom2_set_page_visible(0);
    pom2PersistNow();
  });
  window.addEventListener('pageshow', function() {
    if (!document.hidden && Module._pom2_set_page_visible)
      Module._pom2_set_page_visible(1);
  });

  Module.preRun = (Module.preRun || []);
  // ?url=: hold main() until the image is in MEMFS, then hand it over as the
  // positional disk. Module.arguments is the very array callMain() reads, so
  // pushing into it here (before the dependency is released) is enough.
  if (_urlDisk) Module.preRun.push(function() {
    const fs     = Module.FS || (typeof FS !== 'undefined' ? FS : null);
    const addDep = Module.addRunDependency ||
                   (typeof addRunDependency !== 'undefined' ? addRunDependency : null);
    const delDep = Module.removeRunDependency ||
                   (typeof removeRunDependency !== 'undefined' ? removeRunDependency : null);
    if (addDep) addDep('pom2-url-disk');
    setStatus('Loading POM2: downloading the disk image…');
    _urlDisk.then(function(disk) {
      fs.mkdirTree('/uploads/url');
      const path = '/uploads/url/' + disk.name;
      fs.writeFile(path, disk.bytes);
      _args.push(path);
    }).catch(function(e) {
      errEl.style.display = 'block';
      errEl.textContent = 'Could not load the disk image from\n' + _url +
                          '\n' + e.message + '\nStarting without a disk.';
      setTimeout(function() { errEl.style.display = 'none'; }, 12000);
    }).finally(function() {
      if (delDep) delDep('pom2-url-disk');
    });
  });
  Module.preRun.push(function() {
    // Reach the runtime through `Module` rather than the bare globals: the
    // shell's <script> is a different scope from the generated glue, and
    // which names leak into the page has changed across Emscripten releases.
    // These four are in EXPORTED_RUNTIME_METHODS (see CMakeLists.txt).
    const fs   = Module.FS   || (typeof FS   !== 'undefined' ? FS   : null);
    const idb  = Module.IDBFS|| (typeof IDBFS!== 'undefined' ? IDBFS: null);
    const addDep = Module.addRunDependency ||
                   (typeof addRunDependency !== 'undefined' ? addRunDependency : null);
    const delDep = Module.removeRunDependency ||
                   (typeof removeRunDependency !== 'undefined' ? removeRunDependency : null);
    if (!fs || !idb) {
      console.warn('POM2: no IDBFS in this build — settings will not persist.');
      return;
    }
    // Every path out of here MUST release the dependency exactly once —
    // holding it forever does not degrade the browser build, it stops the
    // emulator from ever starting: the page sits on "downloading assets…"
    // with the splash up and no frame ever drawn. Observed for real while
    // testing this code, when a deleteDatabase() from a previous page left
    // the open blocked and the syncfs callback simply never fired.
    let released = false;
    const release = function(why) {
      if (released) return;
      released = true;
      if (why) console.warn('POM2: ' + why);
      if (delDep) delDep('pom2-idbfs');
    };
    try {
      fs.mkdir('/persistent');
      fs.mount(idb, {}, '/persistent');
      if (addDep) addDep('pom2-idbfs');
      // The watchdog is the whole point of the previous paragraph: a browser
      // that never answers must cost the visitor their stored settings, not
      // the emulator. Five seconds is far past a healthy IndexedDB open
      // (milliseconds) and far short of a visitor giving up on the page.
      const watchdog = setTimeout(function() {
        release('IndexedDB did not answer in 5 s — starting without stored ' +
                'settings. Anything you change now may not be remembered.');
      }, 5000);
      fs.syncfs(true, function (err) {
        clearTimeout(watchdog);
        if (err) {
          // IndexedDB disabled (private mode, blocked storage). The
          // emulator runs; it just starts fresh every time.
          console.warn('POM2: settings could not be restored:', err);
        }
        release();
      });
    } catch (e) {
      console.warn('POM2: IDBFS mount failed, settings will not persist:', e);
      release();
    }
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
